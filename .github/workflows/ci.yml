name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  i18n:
    name: i18n completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every language pack has every key
        run: |
          node -e "
          const fs=require('fs');const d='src/renderer/i18n';
          const keys=o=>Object.entries(o).flatMap(([k,v])=>typeof v==='object'?keys(v).map(x=>k+'.'+x):[k]);
          const ref=keys(JSON.parse(fs.readFileSync(d+'/en.json','utf8'))).sort().join();
          let bad=0;
          for(const f of fs.readdirSync(d).filter(f=>f.endsWith('.json'))){
            const k=keys(JSON.parse(fs.readFileSync(d+'/'+f,'utf8'))).sort().join();
            if(k!==ref){bad++;console.log('KEY MISMATCH:',f)}
          }
          if(bad)process.exit(1);console.log('all language packs complete');
          "
